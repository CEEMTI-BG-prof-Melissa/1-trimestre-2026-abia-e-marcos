<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <title> Formulário HTML </title> <!--Acerto 1-->
    <meta charset="UTF-8">
  </head> <!--Acerto 2-->

  <body>
    <h1> Cadastro de Usuário </h1> <!--Acerto 3-->
    <form action="cadastro.php" method=get>  <!--Acerto 4-->
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="name"> <!--Acerto 5-->
      <br>
      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email"> <!--Acerto 6-->
      <br>
      <label for="senha">Senha:</label>
      <input type="password" id="senha" name="senha"> <!--Acerto 7-->
      <br>
      <label for="idade">Idade:</label>
      <input type="number" id="idade" name="idade">
      <br>
      <label for="nascimento">Data de Nascimento:</label> <!--Erro 1-->
      <input type="date" id="nascimento" name="nascimento"> <!--Acerto 8-->
      <br>
      <p>Turno:</p>
      <input type="radio" name="turno" id="manha"> <label for="manha">Manhã</label>
      <input type="radio" name="turno" id="tarde"> <label for="tarde">Tarde</label> <!--Acerto 9--> <!--Acerto 10-->
      <input type="radio" name="turno" id="noite"> <label for="noite">Noite</label>
      <br>
      <p>Áreas de interesse:</p>
      <input type="checkbox" name="area" id="progamacao"> <label for="progamacao">Programação</label>
      <input type="checkbox" name="area" id="design"> <label for="design">Design</label>
      <input type="checkbox" name="area" id="redes"> <label for="redes">Redes</label> <!--Acerto 11-->
      <br>
      <input type="submit" value="Enviar"> <!--Acerto 12-->
      <input type="reset" value="Limpar"> <!--Acerto 13-->
    </form>
  </body>
</html>
