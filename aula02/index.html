<!DOCTYPE HTML>
    <html lang="pt-br">
        <body>
            <title>Controles de Formulários</title>
            <form action="/index.html" method="get">
                <h1>Preferências</h1>
                Nome:<input type="text" id="nome" name="nome">
                <br>
                <p>Qual turno você prefere estudar?</p>
                <input type="radio" name="turno" id="manha" value="manha"> 
                <label for="manha">Manhã</label>
                <br>
                <input type="radio" name="turno" id="tarde" value="tarde"> 
                <label for="noite">Tarde</label>
                <br>
                <input type="radio" name="turno" id="noite" value="noite">
                <label for="noite">Noite</label>
                <br>
                <p>Quais áreas de tecnologia você te interesse?</p>
                <input type="checkbox" name="tecnologia" id="programacao" value="programacao"> 
                <label for="programaçao">Programação</label>
                <br>
                <input type="checkbox" name="tecnologia" id="design" value="design"> 
                <label for="design">Design</label>
                <br>
                <input type="checkbox" name="tecnologia" id="banco_de_dados" value="banco_de_dados"> 
                <label for="banco_de_dados">Banco de dados</label>
                <br>
                <input type="checkbox" name="tecnologia" id="redes" value="redes"> 
                <label for="redes">Redes</label>
                <br>
                Qual sua cor favorita?<input type="color" name="cor" id="cor">
                <br>
                <br>
                Qual seu nível de satisfação?<input type="range" name="satisfação" id="satisfação" >
                <br>
                <br>
                Qual seu horário preferido?<input type="time" name="horario" id="horario">
                <br>
                <br>
                Envie um arquivo<input type="file" name="arquivo" id="arquivo">Nenhum arquivo escolhido
                <br>
                <br>
                <input type="submit" value="Cadastrar">
                <input type="reset" value="Limpar">
            </form>
        </body>
    </html>
